aid: aciworldwide
name: Aciworldwide
description: >-
  ACI Worldwide is a global real-time payments software company (NASDAQ: ACIW)
  whose Open Payment Platform — the PAY.ON / OPPWA gateway — exposes a single
  unified RESTful API for accepting and managing electronic payments worldwide.
  Merchants and payment intermediaries integrate card and alternative payment
  methods through server-to-server calls, the hosted COPYandPAY widget, mobile
  SDKs, and Pay by Link. The API covers payments, checkouts, tokenization and
  registrations, back-office capture/refund/reversal operations, 3-D Secure,
  fraud and risk management, recurring/scheduled payments, webhooks for
  transaction notifications, and reporting. Test transactions run against
  eu-test.oppwa.com and go live on eu-prod.oppwa.com. This profile was added to
  the API Evangelist network as a portfolio lead and enriched by the pipeline.
