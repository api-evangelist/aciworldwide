  decline_codes: errors/aciworldwide-decline-codes.yml
  lifecycle: lifecycle/aciworldwide-lifecycle.yml
  authentication: authentication/aciworldwide-authentication.yml
  webhooks: asyncapi/aciworldwide-webhooks.yml
